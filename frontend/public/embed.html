<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SmartCare 嵌入容器</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#F3F1EA}
  #frame{border:0;width:100%;height:100%;display:block}
  #tip{font:14px/1.6 system-ui;color:#5b6b63;padding:24px}
</style>
</head>
<body>
<div id="tip">正在与重症系统握手…</div>
<iframe id="frame" title="SmartCare" style="display:none"
        allow="fullscreen; autoplay; clipboard-write; microphone"></iframe>

<script>
(function () {
  'use strict';

  /* ========== 1. 配置区（现场只改这里） ========== */
  var CONFIG = {
    // 允许的宿主来源白名单；留空数组 + requireOriginWhitelist=true 会拒绝全部消息
    allowedHostOrigins: [
      'http://192.168.5.154',
      'http://192.168.5.154:8080',
      'http://192.168.10.182:60000'
    ],
    // 白名单为空时是否拒绝全部宿主消息（true=安全默认，false=仅联调试用）
    requireOriginWhitelist: true,
    // 是否允许仅凭姓名+床号自动跳转（false=必须人工确认）
    allowNameBedFallback: false,
    hideChrome: true,        // 隐藏 SmartCare 自带顶部导航（嵌入时用宿主菜单）
    hideFloater: false,      // 是否隐藏 AI 悬浮球
    injectToken: true,       // 把宿主 token 加到内层请求的 Authorization 头
    handshakeRetryMs: 400,   // Ready 重发间隔
    handshakeMaxTry: 20,
    standaloneAfterMs: 4000  // 超时未收到消息时，无患者也先把页面渲染出来（实际生效值不会早于握手窗口结束）
  };

  // 页面别名 → 真实路由。page=xxx
  var PAGE_MAP = {
    // Patient workbench
    'patients':            { path: '/patients' },
    'patient':             { path: '/patient/:id', needPatient: true },
    'patient-overview':    { path: '/patient/:id/overview', needPatient: true },
    'patient-monitoring':  { path: '/patient/:id/monitoring', needPatient: true },
    'patient-care':        { path: '/patient/:id/treatment', needPatient: true },
    'patient-decisions':   { path: '/patient/:id/alerts', needPatient: true },
    'patient-intelligence':{ path: '/patient/:id/intelligence', needPatient: true },
    'patient-documents':   { path: '/patient/:id/documents', needPatient: true },
    'patient-followup':    { path: '/patient/:id/followup', needPatient: true },
    'bedside':             { path: '/bedside/:id', needPatient: true },

    // Disease center
    'disease-center':      { path: '/disease-center' },
    'disease-overview':    { path: '/disease-center/overview' },
    'disease-diseases':    { path: '/disease-center/diseases' },
    'disease-terminology': { path: '/disease-center/terminology' },
    'disease-scores':      { path: '/disease-center/scores' },
    'disease-phenotypes':  { path: '/disease-center/phenotypes' },
    'disease-offline-packages': { path: '/disease-center/offline-packages' },
    'disease-reviews':     { path: '/disease-center/reviews' },
    'disease-ai':          { path: '/disease-center/ai' },
    'disease-quality':     { path: '/disease-center/quality' },

    // Handover center
    'handover':            { path: '/handover' },
    'handover-overview':   { path: '/handover/overview' },
    'handover-patients':   { path: '/handover/patients' },
    'handover-patient':    { path: '/handover/patient/:id', needPatient: true },
    'handover-tasks':      { path: '/handover/tasks' },
    'handover-history':    { path: '/handover/history' },
    'handover-settings':   { path: '/handover/settings' },

    // Other pages
    'bigscreen':       { path: '/bigscreen' },
    'clinical':        { path: '/clinical-workflow' },
    'rounding':        { path: '/rounding-sheet' },
    'respiratory':     { path: '/respiratory-dashboard' },
    'nutrition':       { path: '/nutrition-support' },
    'analytics':       { path: '/analytics' },
    'ai-consult':      { path: '/ai-consult' },
    'mdt':             { path: '/mdt' },
    'research':        { path: '/research-workbench' },
    'academic':        { path: '/academic-research' },
    'trials':          { path: '/clinical-trials' },
    'doctor-home':     { path: '/doctor-home' },
    'nurse-home':      { path: '/nurse-home' },
    'admin-config':    { path: '/admin/runtime-config' },
    'scanner-health':  { path: '/admin/scanner-health' },
    'ai-ops':          { path: '/ai-ops' },
    'research-export': { path: '/research-export' },
    'voice-review':    { path: '/admin/voice-correction-review' },
    'head-nurse-home': { path: '/head-nurse-home' },
    'director-home':   { path: '/director-home' },
    'mobile':          { path: '/m' }
  };

  // 宿主角色 → SmartCare 角色（守卫用到 doctor/nurse/head_nurse/director）
  var ROLE_MAP = {
    '医生': 'doctor', '主治医生': 'doctor', 'doctor': 'doctor',
    '护士': 'nurse', 'nurse': 'nurse',
    '护士长': 'head_nurse', 'head_nurse': 'head_nurse', 'charge_nurse': 'head_nurse',
    '主任': 'director', 'director': 'director'
  };

  /* ========== 2. 内部状态 ========== */
  var qs = new URLSearchParams(location.search);
  var pageKey = qs.get('page') || 'patients';
  var rawPath = qs.get('path');                    // 也支持直接给路由：?path=/patient/xxx
  var target = rawPath ? { path: rawPath, needPatient: /:id/.test(rawPath) }
                       : (PAGE_MAP[pageKey] || PAGE_MAP['patients']);

  var frame = document.getElementById('frame');
  var tip = document.getElementById('tip');
  var hostOrigin = guessHostOrigin();
  var received = false, tries = 0, timer = null;
  var lastKey = '';           // 去重：账号+患者
  var identity = {};          // 身份 query
  var token = '';
  var patientIdCache = {};    // mrn/hisPid → _id

  /* ========== 3. 握手 ========== */
  function guessHostOrigin() {
    try {
      if (document.referrer) return new URL(document.referrer).origin;
    } catch (e) {}
    return '*';
  }

  function originAllowed(origin) {
    var list = CONFIG.allowedHostOrigins || [];
    if (!list.length) {
      if (CONFIG.requireOriginWhitelist) {
        console.error('[embed] 未配置 allowedHostOrigins，已拒绝全部宿主消息');
        return false;
      }
      return true;                               // 联调试用：未配置=不校验
    }
    for (var i = 0; i < list.length; i++) {
      if (origin === list[i]) return true;
    }
    return false;
  }

  function sendReady() {
    if (received || tries >= CONFIG.handshakeMaxTry) { clearInterval(timer); return; }
    tries++;
    if (hostOrigin !== '*') {
      try { parent.postMessage({ type: 'SmartCareReady' }, hostOrigin); } catch (e) {}
    } else {
      var list = CONFIG.allowedHostOrigins || [];
      if (list.length) {
        for (var i = 0; i < list.length; i++) {
          try { parent.postMessage({ type: 'SmartCareReady' }, list[i]); } catch (e) {}
        }
      } else {
        try { parent.postMessage({ type: 'SmartCareReady' }, '*'); } catch (e) {}
      }
    }
  }

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'SmartCare') return;
    if (!originAllowed(e.origin)) {
      console.warn('[embed] 忽略非白名单来源的消息:', e.origin);
      return;
    }
    received = true;
    hostOrigin = e.origin;
    clearInterval(timer);
    handlePayload(e.data);
  });

  /** Send a typed event back to the host */
  function sendToHost(eventType, extra) {
    var msg = { type: eventType, version: '1.0' };
    if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) msg[k] = extra[k]; } }
    try { parent.postMessage(msg, hostOrigin); } catch (e) {}
  }

  timer = setInterval(sendReady, CONFIG.handshakeRetryMs);
  sendReady();

  // 宿主一直没回：先把不需要患者的页面渲染出来，别白屏
  // 实际生效值不会早于握手窗口结束（避免在握手完成前就渲染"无患者"页面）
  setTimeout(function () {
    if (received) return;
    if (target.needPatient) {
      tip.textContent = '未收到宿主系统的患者信息（SmartCare 消息），请检查 iframe 地址与 origin 配置。';
    } else {
      navigate(buildUrl(target.path, ''));
    }
  }, Math.max(CONFIG.standaloneAfterMs, CONFIG.handshakeRetryMs * CONFIG.handshakeMaxTry + 500));

  /* ========== 4. 处理宿主消息 ========== */
  function handlePayload(data) {
    var account = data.account || data.user || data.userInfo || {};
    var patient = data.patient || {};
    var nav = data.navigation || {};
    var requestId = data.requestId || '';
    token = String(data.token || '');             // 只放内存，不落 storage、不打印

    identity = buildIdentity(account, patient);

    // Support dynamic page navigation via PostMessage
    var pageKey = nav.page || '';
    if (pageKey && PAGE_MAP[pageKey]) {
      target = PAGE_MAP[pageKey];
      // Apply resourceId as :id if present
      if (nav.resourceId && target.path.indexOf(':id') >= 0) {
        // Will be used in navigate below
      }
    }

    var key = JSON.stringify([identity, patient.mrn, patient.hisPid, patient.showBed, pageKey]);
    if (key === lastKey && frame.dataset.ready === '1') return;  // duplicate, skip
    lastKey = key;

    sendToHost('SmartCareNavigationStart', { requestId: requestId });

    if (!target.needPatient) {
      var url = buildUrl(target.path, nav.resourceId || '');
      navigate(url);
      sendToHost('SmartCareNavigationSuccess', { requestId: requestId, page: pageKey });
      return;
    }

    tip.style.display = '';
    tip.textContent = '正在定位患者：' + (patient.name || '');
    resolvePatientId(patient).then(function (result) {
      var id = result && result.id || '';
      var matchType = result && result.matchType || '';
      if (!id) {
        frame.style.display = 'none';
        tip.textContent = '未能在 SmartCare 中匹配到该患者（住院号 ' +
          (patient.mrn || '-') + ' / HIS ' + (patient.hisPid || '-') +
          '），请确认该患者已在科并且两侧使用同一 patient 集合。';
        sendToHost('SmartCareNavigationError', { requestId: requestId, code: 'PATIENT_NOT_FOUND' });
        return;
      }
      if (matchType === 'ambiguous') {
        frame.style.display = 'none';
        tip.textContent = '';
        tip.appendChild(document.createTextNode(
          '按姓名+床号匹配到多位患者，无法确定，请让宿主系统传入住院号（mrn）或 HIS 患者 ID。'
        ));
        sendToHost('SmartCareNavigationError', { requestId: requestId, code: 'PATIENT_AMBIGUOUS' });
        return;
      }
      if (matchType === 'name_bed' && !CONFIG.allowNameBedFallback) {
        frame.style.display = 'none';
        tip.textContent = '';
        tip.appendChild(document.createTextNode(
          '按姓名+床号匹配到患者：' + (patient.name || '') + '，床位 ' + (patient.showBed || patient.hisBed || '-') + '。'
        ));
        var btn = document.createElement('button');
        btn.textContent = '确认是该患者，继续打开';
        btn.style.cssText = 'margin-left:8px;padding:4px 12px;cursor:pointer';
        btn.addEventListener('click', function () {
          btn.disabled = true;
          navigate(buildUrl(target.path, id));
          sendToHost('SmartCareNavigationSuccess', { requestId: requestId, page: pageKey, patientId: id });
        });
        tip.appendChild(btn);
        return;
      }
      navigate(buildUrl(target.path, id));
      sendToHost('SmartCareNavigationSuccess', { requestId: requestId, page: pageKey, patientId: id });
    });
  }

  function pick() {
    for (var i = 0; i < arguments.length; i++) {
      var v = arguments[i];
      if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
    }
    return '';
  }

  function buildIdentity(account, patient) {
    var rawRole = pick(account.role, account.roleCode, account.roleName, account.userRole);
    return {
      user_id:   pick(account.user_id, account.userId, account.id, account.empNo, account.code, account.staffCode, account.empCode, account.loginName, account.accountName),
      userName:  pick(account.userName, account.username, account.name, account.realName, account.staffName, account.staffCode, account.empCode, account.actor, account.loginName, account.trueName, account.displayName),
      role:      ROLE_MAP[rawRole] || ROLE_MAP[String(rawRole).toLowerCase()] || rawRole,
      dept:      pick(patient.dept, account.dept, account.deptName, account.department, account.departmentName),
      dept_code: pick(patient.deptCode, patient.deptCode2, patient.dept_code, patient.departmentCode, account.deptCode, account.dept_code, account.departmentCode)
    };
  }

  function buildUrl(pathTpl, patientId) {
    var path = pathTpl.replace(':id', encodeURIComponent(patientId || ''));
    var p = new URLSearchParams();
    Object.keys(identity).forEach(function (k) { if (identity[k]) p.set(k, identity[k]); });
    // Pass token via URL so Vue can read it before mount (earlier than load event patching)
    if (token) p.set('__sc_token', token);
    // 透传宿主额外参数（tab、hours 等），page/path 不传
    qs.forEach(function (v, k) { if (k !== 'page' && k !== 'path') p.set(k, v); });
    var s = p.toString();
    return path + (s ? '?' + s : '');
  }

  /* ========== 5. 患者 ID 翻译（mrn/hisPid → Mongo _id） ========== */
  var OID = /^[0-9a-fA-F]{24}$/;

  function directId(patient) {
    var raw = patient._id;
    if (raw && typeof raw === 'object') raw = raw.$oid || raw.oid;
    var cands = [raw, patient.id, patient.patientId, patient.patient_id, patient.pid];
    for (var i = 0; i < cands.length; i++) {
      var v = cands[i] == null ? '' : String(cands[i]).trim();
      if (OID.test(v)) return v;
    }
    return '';
  }

  function norm(v) { return String(v == null ? '' : v).trim().toUpperCase(); }

  /** 带宿主 token 的 fetch，失败时降级为空对象 */
  function authedFetch(url) {
    var headers = {};
    if (token) {
      headers['Authorization'] = 'Bearer ' + token;
      headers['X-SmartCare-Token'] = token;
    }
    return fetch(url, { credentials: 'same-origin', headers: headers })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; });
  }

  function resolvePatientId(patient) {
    var hit = directId(patient);
    if (hit) return Promise.resolve({ id: hit, matchType: 'direct' });

    var ck = norm(patient.mrn) + '|' + norm(patient.hisPid);
    if (patientIdCache[ck]) return Promise.resolve(patientIdCache[ck]);

    var params = new URLSearchParams();
    if (patient.mrn) params.set('mrn', patient.mrn);
    if (patient.hisPid) params.set('his_pid', patient.hisPid);
    if (patient.name) params.set('name', patient.name);
    var bed = patient.showBed || patient.hisBed;
    if (bed) params.set('bed', bed);
    var deptCode = patient.deptCode || patient.deptCode2;
    if (deptCode) params.set('dept_code', deptCode);

    var url = '/api/patients/resolve?' + params.toString();
    return authedFetch(url).then(function (j) {
      var pid = j.patient_id || '';
      var mt = j.match_type || '';
      var result = { id: pid, matchType: mt };
      if (pid) patientIdCache[ck] = result;
      return result;
    });
  }

  /* ========== 6. 渲染内层页面 ========== */
  function navigate(url) {
    tip.style.display = 'none';
    frame.style.display = 'block';
    var cur = '';
    try { cur = frame.contentWindow.location.pathname + frame.contentWindow.location.search; } catch (e) {}
    if (cur && frame.dataset.ready === '1') {
      // 已加载过：切患者时走 replace，避免重新拉整个 bundle
      try { frame.contentWindow.location.replace(url); return; } catch (e) {}
    }
    frame.src = url;
  }

  frame.addEventListener('load', function () {
    frame.dataset.ready = '1';
    var win, doc;
    try { win = frame.contentWindow; doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;

    if (CONFIG.hideChrome) {
      var css = 'header.hdr{display:none!important}' +
                '.side-nav{display:none!important;width:0!important;min-width:0!important;padding:0!important;overflow:hidden!important}' +
                '.shell-main{flex:1 1 100%!important;min-width:0!important}' +
                '.root>.body,main.body{padding-top:0!important}' +
                (CONFIG.hideFloater ? '.ai-pulse-floater,[class*="pulse-floater"]{display:none!important}' : '');
      var st = doc.createElement('style');
      st.setAttribute('data-embed', '1');
      st.textContent = css;
      doc.head.appendChild(st);
      function hideSideNav() {
        var sn = doc.querySelector('.side-nav, aside.side-nav');
        if (sn) { sn.style.display = 'none'; }
        var sm = doc.querySelector('.shell-main');
        if (sm) { sm.style.flex = '1 1 100%'; sm.style.minWidth = '0'; }
      }
      hideSideNav();
      try {
        var mo = new MutationObserver(function() { hideSideNav(); });
        mo.observe(doc.body || doc.documentElement, { childList: true, subtree: true });
        setTimeout(function() { mo.disconnect(); }, 8000);
      } catch(e) {}
    }

    if (CONFIG.injectToken && token) {
      win.__SMARTCARE_TOKEN__ = token;
      patchNetwork(win, token);
    }
  });

  /** 给内层 XHR / fetch / WebSocket 注入宿主 token */
  function patchNetwork(win, tk) {
    patchXhr(win, tk);
    patchFetch(win, tk);
    patchWebSocket(win, tk);
  }

  // XHR：给 /api/*、/health*、/ws* 自动带 Authorization 头
  function patchXhr(win, tk) {
    try {
      var proto = win.XMLHttpRequest && win.XMLHttpRequest.prototype;
      if (!proto || proto.__embedPatched) return;
      var open = proto.open, send = proto.send;
      proto.open = function (m, u) { this.__embedUrl = String(u || ''); return open.apply(this, arguments); };
      proto.send = function () {
        try {
          if (/^\/(api|health|ws)/.test(this.__embedUrl || '')) {
            this.setRequestHeader('Authorization', 'Bearer ' + tk);
            this.setRequestHeader('X-SmartCare-Token', tk);
          }
        } catch (e) {}
        return send.apply(this, arguments);
      };
      proto.__embedPatched = true;
    } catch (e) {}
  }

  // fetch：兼容 fetch(string, init) 和 fetch(Request) 两种调用形式
  function patchFetch(win, tk) {
    try {
      if (!win.fetch || win.fetch.__embedPatched) return;
      var origFetch = win.fetch;
      win.fetch = function (input, init) {
        try {
          var url = typeof input === 'string' ? input : (input && input.url || '');
          if (/^\/(api|health|ws)/.test(url)) {
            var headers;
            if (input instanceof win.Request) {
              var req = new win.Request(input, init);
              headers = new win.Headers(req.headers);
            } else {
              headers = new win.Headers((init && init.headers) || {});
            }
            headers.set('Authorization', 'Bearer ' + tk);
            headers.set('X-SmartCare-Token', tk);
            if (input instanceof win.Request) {
              input = new win.Request(input, { headers: headers });
              init = undefined;
            } else {
              init = init || {};
              init.headers = headers;
            }
          }
        } catch (e) {}
        return origFetch.apply(this, [input, init]);
      };
      win.fetch.__embedPatched = true;
    } catch (e) {}
  }

  // WebSocket：URL 追加 token 查询参数（协议限制无法设请求头）
  function patchWebSocket(win, tk) {
    try {
      if (!win.WebSocket || win.WebSocket.__embedPatched) return;
      var OrigWS = win.WebSocket;
      var PatchedWS = function (url, protocols) {
        try {
          if (/^\/(api|health|ws)/.test(url || '') && !/[?&]token=/.test(url)) {
            url += (url.indexOf('?') === -1 ? '?' : '&') + 'token=' + encodeURIComponent(tk);
          }
        } catch (e) {}
        if (protocols !== undefined) return new OrigWS(url, protocols);
        return new OrigWS(url);
      };
      PatchedWS.prototype = OrigWS.prototype;
      PatchedWS.CONNECTING = OrigWS.CONNECTING;
      PatchedWS.OPEN = OrigWS.OPEN;
      PatchedWS.CLOSING = OrigWS.CLOSING;
      PatchedWS.CLOSED = OrigWS.CLOSED;
      PatchedWS.__embedPatched = true;
      win.WebSocket = PatchedWS;
    } catch (e) {}
  }
})();
</script>
</body>
</html>
